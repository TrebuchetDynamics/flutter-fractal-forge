name: Apple release builds (unsigned)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version name
        required: true
        type: string
      release_build_number:
        description: Release build number
        required: true
        type: string
      release_commit:
        description: Immutable 40-character source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.release_build_number }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      APPLE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Validate release identity
        shell: bash
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_commit }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          args=("$APPLE_PLATFORM" --release)
          if [[ "$APPLE_PLATFORM" == ios ]]; then args+=(--no-codesign); fi
          flutter build "${args[@]}" \
            --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define="RELEASE_VERSION=$RELEASE_VERSION" \
            --dart-define="RELEASE_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" \
            --dart-define="RELEASE_COMMIT=$RELEASE_COMMIT"
      - name: Package app and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPLE_PLATFORM" == ios ]]; then
            app=build/ios/iphoneos/Runner.app
          else
            app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          fi
          [[ -n "$app" && -d "$app" ]] || { echo 'App bundle missing' >&2; exit 1; }
          mkdir -p release-artifacts
          archive="release-artifacts/fractal-forge-$APPLE_PLATFORM-unsigned.zip"
          ditto -c -k --keepParent "$app" "$archive"
          export APPLE_ARCHIVE="$archive"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform
          archive = pathlib.Path(os.environ['APPLE_ARCHIVE'])
          metadata = dict(version=os.environ['RELEASE_VERSION'],
                          buildNumber=os.environ['RELEASE_BUILD_NUMBER'],
                          commit=os.environ['RELEASE_COMMIT'],
                          sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
                          platform=os.environ['APPLE_PLATFORM'],
                          signing='unsigned-or-ad-hoc; not notarized; not App Store ready',
                          builderArchitecture=platform.machine())
          archive.with_suffix('.json').write_text(json.dumps(metadata, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-build-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
