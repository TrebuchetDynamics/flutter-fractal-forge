name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tracked artifact audit
        run: scripts/audit-tracked-artifacts.sh
      - name: Install script test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Script tests
        run: bats test/scripts/*.bats
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Full host test suite
        run: flutter test
      - name: Release evidence generator tests
        run: python3 -m unittest discover -s test/scripts -p 'test_generate_release_evidence.py'
