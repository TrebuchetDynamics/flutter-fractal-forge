name: F-Droid source build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version name (X.Y.Z)'
        required: true
        type: string
      release_build_number:
        description: 'Android versionCode'
        required: true
        type: string
      release_commit:
        description: 'Immutable 40-character commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_BUILD: ${{ inputs.release_build_number }}
          INPUT_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${TAG_NAME#v}"
            build_number="${version##*.}"
            commit="$TAG_COMMIT"
          else
            version="$INPUT_VERSION"
            build_number="$INPUT_BUILD"
            commit="$INPUT_COMMIT"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "${version##*.}" == "$build_number" ]] || {
            echo "Release patch and Android versionCode must match" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.commit }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Build twice and verify official F-Droid inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          export PATH="$build_tools:$PATH"
          scripts/build-fdroid.sh \
            --flutter-bin="$(command -v flutter)" \
            --version="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --commit="$RELEASE_COMMIT" \
            --output-dir=release-artifacts/fdroid \
            --reproducible
      - name: Lint and source-scan against current fdroiddata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://gitlab.com/fdroid/fdroiddata.git /tmp/fdroiddata
          cp release-artifacts/fdroid/fdroiddata/metadata/com.trebuchetdynamics.fractal.forge.yml \
            /tmp/fdroiddata/metadata/
          image=registry.gitlab.com/fdroid/docker-executable-fdroidserver@sha256:1a40f19ed0ae9c3341466991851b5916e9fa0e2100bcdac097a3fcd15d105798
          docker run --rm \
            -v /tmp/fdroiddata:/repo \
            -w /repo \
            "$image" \
            lint com.trebuchetdynamics.fractal.forge
          base_code=${{ steps.release.outputs.build_number }}
          docker run --rm \
            -v /tmp/fdroiddata:/repo \
            -w /repo \
            "$image" \
            scanner --exit-code \
            "com.trebuchetdynamics.fractal.forge:$((base_code * 10 + 1))" \
            "com.trebuchetdynamics.fractal.forge:$((base_code * 10 + 2))" \
            "com.trebuchetdynamics.fractal.forge:$((base_code * 10 + 3))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fdroid-source-build-${{ steps.release.outputs.version }}
          path: release-artifacts/fdroid
          if-no-files-found: error
          retention-days: 30
