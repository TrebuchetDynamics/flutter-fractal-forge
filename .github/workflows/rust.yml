name: Rust checks

on:
  push:
    paths:
      - 'rust/**'
      - 'scripts/ci/rust-check.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'scripts/ci/rust-check.sh'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision pinned Rust and locked dependencies
        shell: bash
        run: |
          version="$(awk -F '"' '/^channel = / { print $2 }' rust/rust-toolchain.toml)"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          cd rust
          cargo fetch --locked
      - name: Check offline (no publication)
        run: scripts/ci/rust-check.sh
