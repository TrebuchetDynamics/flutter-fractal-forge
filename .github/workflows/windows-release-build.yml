name: Windows release build

# Flutter's Windows target cannot be cross-compiled from Linux, so
# scripts/release.sh dispatches this workflow to build on a real windows
# runner and downloads the resulting artifact via `gh run download`.

on:
  workflow_dispatch:
    inputs:
      confirm_windows_build:
        description: "Type build-windows-release to build a release Windows bundle"
        required: true
        type: string
      release_version:
        description: "Release version name bound to the bundle"
        required: true
        type: string
      release_build_number:
        description: "Release build number bound to the bundle"
        required: true
        type: string
      release_commit:
        description: "Immutable 40-character commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event.inputs.confirm_windows_build == 'build-windows-release'
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.release_build_number }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release commit" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version" >&2; exit 1; }
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid release build number" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: Build Windows release bundle
        shell: bash
        run: |
          flutter build windows --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define="RELEASE_VERSION=$RELEASE_VERSION" \
            --dart-define="RELEASE_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" \
            --dart-define="RELEASE_COMMIT=$RELEASE_COMMIT"
      - name: Package bundle as zip
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$(find build/windows -type d -path '*/runner/Release' | head -n1)"
          [[ -n "$bundle_dir" ]] || { echo "Release bundle directory not found" >&2; exit 1; }
          mkdir -p release-artifacts
          (cd "$bundle_dir/.." && 7z a -tzip "$OLDPWD/release-artifacts/fractal-forge-windows-x64.zip" "Release")
          archive="release-artifacts/fractal-forge-windows-x64.zip"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf '{"version":"%s","buildNumber":"%s","commit":"%s","sha256":"%s"}\n' \
            "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" "$RELEASE_COMMIT" "$sha256" \
            > release-artifacts/windows-build-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          path: |
            release-artifacts/fractal-forge-windows-x64.zip
            release-artifacts/windows-build-metadata.json
          retention-days: 14
