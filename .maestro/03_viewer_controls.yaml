appId: com.trebuchetdynamics.fractal.forge
name: "03 — Viewer Controls: Zoom, Export, Navigate"
tags:
  - viewer
  - controls
---
- runFlow: helpers/ensure_catalog.yaml

- runFlow:
    file: helpers/open_fractal.yaml
    env:
      FRACTAL_QUERY: "Aizawa Attractor"
      FRACTAL_CARD_REGEX: ".*Aizawa Attractor fractal, .*2D.*"

- assertVisible:
    text: ".*Randomize.*Controls.*"

- takeScreenshot: "03_viewer_active"

- longPressOn:
    text: ".*Randomize.*Controls.*"

- extendedWaitUntil:
    visible:
      text: ".*Controls.*"
    timeout: 10000

- assertVisible:
    text: "Iterations"
- assertVisible:
    text: ".*Fluid mode.*"
- tapOn:
    text: ".*Fluid mode.*"
- extendedWaitUntil:
    visible:
      text: ".*Fluid intensity.*"
    timeout: 10000
- assertVisible:
    text: ".*Fluid intensity.*"

- takeScreenshot: "03_controls_sheet"

- tapOn: "Close this dialog"
- waitForAnimationToEnd

- tapOn:
    text: ".*Randomize.*Controls.*"

- extendedWaitUntil:
    visible:
      text: ".*Randomize.*Controls.*"
    timeout: 20000

- assertVisible:
    text: ".*Share & export.*"

- takeScreenshot: "03_random_fractal"

- pressKey: back
