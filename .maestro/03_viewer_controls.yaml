appId: com.trebuchetdynamics.fractal.forge
name: "03 — Viewer Controls: Zoom, Export, Navigate"
tags:
  - viewer
  - controls
---
- runFlow: helpers/ensure_catalog.yaml

- tapOn:
    text: "Search fractals"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      text: "Search fractals"
    timeout: 10000

- eraseText: 160
- setClipboard: "Aizawa Attractor"
- pasteText
- pressKey: back

- extendedWaitUntil:
    visible:
      text: ".*Aizawa Attractor fractal, .*2D.*"
    timeout: 15000

- tapOn:
    text: ".*Aizawa Attractor fractal, .*2D.*"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 750

- extendedWaitUntil:
    visible:
      text: ".*Randomize.*Controls.*"
    timeout: 20000

- assertVisible:
    text: ".*Randomize.*Controls.*"
- assertVisible: "Export / Wallpaper"

- takeScreenshot: "03_viewer_active"

- longPressOn:
    text: ".*Randomize.*Controls.*"

- extendedWaitUntil:
    visible:
      text: ".*Controls.*"
    timeout: 10000

- assertVisible:
    text: "Iterations"
- assertVisible:
    text: ".*Fluid mode.*"
- tapOn:
    text: ".*Fluid mode.*"
- extendedWaitUntil:
    visible:
      text: ".*Fluid intensity.*"
    timeout: 10000
- assertVisible:
    text: ".*Fluid intensity.*"

- takeScreenshot: "03_controls_sheet"

- tapOn: "Close this dialog"
- waitForAnimationToEnd

- tapOn:
    text: ".*Randomize.*Controls.*"

- extendedWaitUntil:
    visible:
      text: ".*Randomize.*Controls.*"
    timeout: 20000

- assertVisible: "Export / Wallpaper"

- takeScreenshot: "03_random_fractal"

- pressKey: back
