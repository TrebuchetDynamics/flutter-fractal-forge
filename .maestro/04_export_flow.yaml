appId: com.trebuchetdynamics.fractal.forge
name: "04 — Export Flow: Save and Share"
tags:
  - export
  - share
---
- runFlow: helpers/ensure_catalog.yaml

- tapOn:
    text: "Search fractals"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500

- extendedWaitUntil:
    visible:
      text: "Search fractals"
    timeout: 10000

- eraseText: 160
- setClipboard: "Aizawa Attractor"
- pasteText
- pressKey: back

- extendedWaitUntil:
    visible:
      text: ".*Aizawa Attractor fractal, .*2D.*"
    timeout: 15000

- tapOn:
    text: ".*Aizawa Attractor fractal, .*2D.*"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 750

- extendedWaitUntil:
    visible:
      text: ".*Randomize.*Controls.*"
    timeout: 20000

- tapOn: "Export / Wallpaper"

- extendedWaitUntil:
    visible:
      text: "Save & share"
    timeout: 15000

- assertVisible: "Save & share"

- takeScreenshot: "04_export_sheet"

- tapOn: "Save & share"

- waitForAnimationToEnd:
    timeout: 15000

- runFlow:
    when:
      visible:
        text: ".*(Dismiss|Save & share|Share).*"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

- pressKey: back
