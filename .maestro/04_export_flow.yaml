appId: com.trebuchetdynamics.fractal.forge
name: "04 — Export Flow: Save and Share"
tags:
  - export
  - share
---
- runFlow: helpers/ensure_catalog.yaml

- runFlow:
    file: helpers/open_fractal.yaml
    env:
      FRACTAL_QUERY: "Aizawa Attractor"
      FRACTAL_CARD_REGEX: ".*Aizawa Attractor fractal, .*2D.*"

- tapOn:
    text: ".*Share & export.*"

- extendedWaitUntil:
    visible:
      text: "Copy view link"
    timeout: 15000

- assertVisible: "Share image"
- tapOn: "Export"

- extendedWaitUntil:
    visible:
      text: "Save & share"
    timeout: 15000

- assertVisible: "Save & share"

- takeScreenshot: "04_export_sheet"

- tapOn: "Save & share"

- waitForAnimationToEnd:
    timeout: 15000

- runFlow:
    when:
      visible:
        text: ".*(Dismiss|Save & share|Share).*"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

- pressKey: back
