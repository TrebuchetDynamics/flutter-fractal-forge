appId: com.trebuchetdynamics.fractal.forge
name: "Helper — Ensure Catalog"
---
# Foreground the app after Maestro installs its Android driver.
- openLink: "fractalforge://view"

- extendedWaitUntil:
    visible:
      text: ".*(Fractal Forge|Skip onboarding).*"
    timeout: 120000

- runFlow:
    when:
      visible:
        text: "Skip onboarding"
    commands:
      - tapOn: "Skip onboarding"

- extendedWaitUntil:
    visible:
      text: "Fractal Forge"
    timeout: 30000

- assertVisible:
    text: "Search fractals"
