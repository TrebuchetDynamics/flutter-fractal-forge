appId: com.trebuchetdynamics.fractal.forge
name: "Helper — Ensure Catalog"
---
- extendedWaitUntil:
    visible:
      text: ".*(Fractal Forge|Skip onboarding|Dismiss|Controls|Export Now|Share|Randomize.*Controls|Export / Wallpaper).*"
    timeout: 120000

- runFlow:
    when:
      visible:
        text: "Skip onboarding"
    commands:
      - tapOn: "Skip onboarding"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: ".*(Dismiss|Controls|Export Now|Share|Randomize.*Controls|Export / Wallpaper).*"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Fractal Forge"
    timeout: 30000

- swipe:
    direction: DOWN
    duration: 900
    waitToSettleTimeoutMs: 400

- swipe:
    direction: DOWN
    duration: 900
    waitToSettleTimeoutMs: 400

- assertVisible:
    text: ".*All categories.*"
